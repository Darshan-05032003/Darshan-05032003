<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Darshan Sonawane, backend and Android engineer">
  <defs>
    <pattern id="rules" width="1200" height="32" patternUnits="userSpaceOnUse">
      <rect width="1200" height="32" fill="#E7EEE2"/>
      <rect y="31" width="1200" height="1" fill="#BFD0C8"/>
    </pattern>
    <style>
      .serif { font-family: "Bodoni 72", "Didot", "Bodoni Moda", Georgia, "Times New Roman", serif; }
      .sans  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .fig   { opacity: 0; animation: rise 0.7s ease-out forwards; }
      .f1 { animation-delay: 0.3s } .f2 { animation-delay: 0.6s } .f3 { animation-delay: 0.9s } .f4 { animation-delay: 1.2s }
      @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
      .stamp { opacity: 0; animation: stamp 0.35s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay: 1.7s; transform-origin: 1060px 282px; }
      @keyframes stamp { from { opacity: 0; transform: scale(1.8) rotate(-6deg) } to { opacity: 1; transform: scale(1) rotate(-6deg) } }
    </style>
  </defs>

  <!-- ledger paper -->
  <rect width="1200" height="320" fill="url(#rules)"/>
  <!-- red double margin rule -->
  <rect x="126" y="0" width="1.5" height="320" fill="#D0786F"/>
  <rect x="130" y="0" width="1.5" height="320" fill="#D0786F"/>

  <!-- margin notes -->
  <text x="112" y="58" text-anchor="end" class="sans" font-size="13" fill="#4E5A70">2026</text>
  <text x="112" y="150" text-anchor="end" class="sans" font-size="13" fill="#4E5A70">Backend ·</text>
  <text x="112" y="168" text-anchor="end" class="sans" font-size="13" fill="#4E5A70">Android</text>

  <!-- name -->
  <text x="160" y="118" class="serif" font-size="84" font-weight="700" fill="#15213B" letter-spacing="-2">Darshan</text>
  <text x="200" y="196" class="serif" font-size="84" font-style="italic" font-weight="500" fill="#15213B" letter-spacing="-1">Sonawane</text>

  <!-- lede -->
  <text x="160" y="248" class="sans" font-size="19" fill="#15213B">Backends that stay correct when twenty people click at once.</text>
  <text x="160" y="276" class="sans" font-size="19" fill="#15213B">Android apps that keep working after you close them.</text>
  <text x="160" y="302" class="sans" font-size="14" fill="#4E5A70">Java · Spring Boot · PostgreSQL · Kafka · Kotlin · Jetpack Compose</text>

  <!-- closing balance (figures) -->
  <g class="sans" font-size="13" fill="#4E5A70">
    <rect x="780" y="52" width="372" height="2" fill="#15213B"/>
    <text x="780" y="42" font-size="12" letter-spacing="2" fill="#4E5A70">CLOSING BALANCE</text>

    <g class="fig f1">
      <text x="780" y="86">Tests across featured repos</text>
      <text x="1152" y="88" text-anchor="end" class="serif" font-size="28" font-weight="700" fill="#15213B">3,100+</text>
      <rect x="780" y="98" width="372" height="1" fill="#BFD0C8"/>
    </g>
    <g class="fig f2">
      <text x="780" y="128">Oversold units in a 20-vs-5 race</text>
      <text x="1152" y="130" text-anchor="end" class="serif" font-size="28" font-weight="700" fill="#15213B">0</text>
      <rect x="780" y="140" width="372" height="1" fill="#BFD0C8"/>
    </g>
    <g class="fig f3">
      <text x="780" y="170">Double charges on retried payments</text>
      <text x="1152" y="172" text-anchor="end" class="serif" font-size="28" font-weight="700" fill="#15213B">0</text>
      <rect x="780" y="182" width="372" height="1" fill="#BFD0C8"/>
    </g>
    <g class="fig f4">
      <text x="780" y="212">Unbalanced journals accepted</text>
      <text x="1152" y="214" text-anchor="end" class="serif" font-size="28" font-weight="700" fill="#15213B">0</text>
      <rect x="780" y="224" width="372" height="1" fill="#BFD0C8"/>
    </g>
  </g>

  <!-- stamp -->
  <g class="stamp">
    <rect x="968" y="262" width="184" height="40" fill="none" stroke="#B3261E" stroke-width="3" rx="3"/>
    <text x="1060" y="290" text-anchor="middle" class="sans" font-size="18" font-weight="700" letter-spacing="3" fill="#B3261E">BALANCED</text>
  </g>
</svg>
